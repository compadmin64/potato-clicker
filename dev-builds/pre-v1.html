<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Potato Clicker</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/latest/pyscript.css" />
    <script defer src="https://pyscript.net/latest/pyscript.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: white;
        }

        .game {
            display: flex;
            height: 100vh;
        }

        .panel {
            width: 20%;
            padding: 15px;
            background-color: #2b2b2b;
        }
            .title {
                font-size: 36px;
                margin-bottom: 20px;
            }

            .potato-btn {
                display: inline-block;
                padding: 18px 28px;
                background: linear-gradient(180deg,#f6c85f,#f09d2f);
                color: #2b2b2b;
                font-weight: bold;
                font-size: 20px;
                border: none;
                border-radius: 12px;
                cursor: pointer;
                box-shadow: 0 6px 0 rgba(0,0,0,0.3);
            }

            .counter {
                font-size: 28px;
                margin-top: 18px;
            }
        .center {
            width: 60%;
            text-align: center;
            }
            /* Cards for upgrades/seeds */
            .section-title {
                margin-top: 0;
                margin-bottom: 8px;
            }

            .cards {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: flex-start;
            }

            .card {
                width: 140px;
                height: 160px;
                background: linear-gradient(180deg,#3a3a3a,#2a2a2a);
                border-radius: 8px;
                padding: 8px;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
            }

            .card-img {
                width: 100%;
                height: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 44px;
                border-radius: 6px;
                background: rgba(255,255,255,0.02);
            }

            .card-name {
                font-size: 14px;
                text-align: center;
            }

            .card-price {
                font-size: 13px;
                color: #ffd27a;
            }

            .buy-btn {
                padding: 6px 8px;
                border-radius: 6px;
                border: none;
                cursor: pointer;
                background: #f09d2f;
                color: #2b2b2b;
                font-weight: bold;
            }

            /* Toasts */
            .toast-container {
                position: fixed;
                top: 16px;
                right: 16px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                z-index: 9999;
                pointer-events: none;
            }

            .toast {
                pointer-events: auto;
                background: rgba(50,50,50,0.96);
                color: #fff;
                padding: 10px 14px;
                border-radius: 8px;
                box-shadow: 0 6px 18px rgba(0,0,0,0.4);
                opacity: 0;
                transform: translateY(-8px);
                transition: opacity 160ms ease, transform 160ms ease;
                font-size: 14px;
                min-width: 160px;
            }

            .toast.show {
                opacity: 1;
                transform: translateY(0);
            }
            /* Planted list */
            .planted-list {
                margin-top: 12px;
                max-height: 180px;
                overflow: auto;
                text-align: left;
                padding: 8px;
                background: rgba(255,255,255,0.02);
                border-radius: 6px;
            }

            .plant-item {
                display: flex;
                justify-content: space-between;
                padding: 6px 4px;
                border-bottom: 1px solid rgba(255,255,255,0.03);
                font-size: 13px;
            }

            .plant-name { font-weight: 600; }

            .plant-timer { color: #ffd27a; }
        </style>

        </head>
        <body>

            <div class="game">
                <div class="panel">
                    <h3>Stats</h3>
                    <div id="potatoes">Potatoes harvested: 0</div>
                    <div id="planted">Planted: 0</div>
                    <div id="balance">Money: $0</div>
                    <div id="prices">Sell: $10</div>
                    <div style="margin-top:8px">
                        <button id="sellBtn" class="buy-btn">Sell All</button>
                    </div>

                    <h3 class="section-title" style="margin-top:12px">Upgrades</h3>
                    <div id="upgradesGrid" class="cards">
                        <!-- Upgrades will be rendered here (moved left) -->
                    </div>
                </div>

                <div class="center">
                    <div class="title">Potato Clicker</div>
                    <button id="potatoBtn" class="potato-btn">Click Potato 🥔</button>
                    <div id="counter" class="counter">0</div>
                    <div id="plantedSection" style="margin-top:12px">
                        <h4 style="margin:6px 0 8px 0">Planted Potatoes</h4>
                        <div id="plantedList" class="planted-list">
                            <!-- planted items with timers -->
                        </div>
                        <div style="margin-top:8px">
                            <button id="harvestAllBtn" class="buy-btn" disabled>Harvest All</button>
                        </div>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="section-title">Seeds</h3>
                    <div id="seedsGrid" class="cards">
                        <!-- Seed cards rendered here (right side) -->
                    </div>
                </div>
            </div>

            <div id="toastContainer" class="toast-container" aria-live="polite"></div>

            <script>
            (function(){
                // --- Game state ---
                window.game = {
                    harvested: [],      // array of harvested potato objects awaiting sale
                    planted: [],        // array of planted potato objects
                    balance: 0,         // dollars
                    baseSellPrice: 10,  // base sell price for common potato
                    sellMultiplier: 1.0,
                    growthSpeedMultiplier: 1.0, // increases speed (1.0 = normal)
                    maxPlots: 3,
                    darkMajicCount: 0   // count of dark majic potatoes
                };

                // DOM elements
                const potatoBtn = document.getElementById('potatoBtn');
                const counter = document.getElementById('counter');
                const potatoesEl = document.getElementById('potatoes');
                const plantedEl = document.getElementById('planted');
                const balanceEl = document.getElementById('balance');
                const pricesEl = document.getElementById('prices');
                const sellBtn = document.getElementById('sellBtn');
                const upGrid = document.getElementById('upgradesGrid');
                const sdGrid = document.getElementById('seedsGrid');
                const plantedListEl = document.getElementById('plantedList');
                const harvestAllBtn = document.getElementById('harvestAllBtn');
                const toastContainer = document.getElementById('toastContainer');

                function formatMoney(n){ return '$' + n.toFixed(2); }

                function showToast(message, duration = 2200){
                    if(!toastContainer) return console.log(message);
                    const t = document.createElement('div');
                    t.className = 'toast';
                    t.textContent = message;
                    toastContainer.appendChild(t);
                    requestAnimationFrame(()=> t.classList.add('show'));
                    setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=> t.remove(), 220); }, duration);
                }

                // --- Seed Definitions ---
                // locked seeds must be unlocked via the Unlock upgrade or appear as unlocked by default
                const seeds = [
                    {id:'common', name:'Common Seed', price:5, img:'🌱', growTime:10, sellValue:null, canBeSold:true, locked:false},
                    {id:'golden', name:'Golden Seed', price:200, img:'✨', growTime:20, sellValue:50, locked:true},
                    {id:'shadow', name:'Shadow Seed', price:25, img:'🌑', growTime:12, sellValue:0, canBeSold:false, isShadow:true, locked:true},
                    {id:'majic', name:'Majic Seed', price:150, img:'🔮', growTime:8, sellValue:100, locked:true},
                    {id:'mythic', name:'Mythic Seed', price:109.9, img:'🌟', growTime:25, sellValue:null, locked:true, isMythic:true},
                    {id:'darkmajic', name:'Dark Majic Seed', price:25, img:'🤍', growTime:15, sellValue:25, locked:true, isDarkMajic:true}
                ];

                // --- Upgrades ---
                const upgrades = [
                    {id:'u_value', name:'Value Increase', price:100, img:'💰', description:'Increase potato selling value by 10%'},
                    {id:'u_plot', name:'Farm Plot', price:150, img:'🧱', description:'Add an additional farm plot'},
                    {id:'u_grow', name:'Growing Increase', price:120, img:'⚡', description:'Increase growing speed by 10%'},
                    {id:'u_unlock', name:'Unlock A New Potato Seed', price:60, img:'🎲', description:'Unlocks a random new seed'}
                ];

                // helper: find seed by id
                function getSeed(id){ return seeds.find(s=>s.id===id); }

                // render cards
                function makeSeedCard(seed){
                    const el = document.createElement('div'); el.className='card';
                    const img = document.createElement('div'); img.className='card-img'; img.textContent = seed.img;
                    const name = document.createElement('div'); name.className='card-name'; name.textContent = seed.name + (seed.locked? ' 🔒':'' );
                    const price = document.createElement('div'); price.className='card-price'; price.textContent = formatMoney(seed.price);
                    const btn = document.createElement('button'); btn.className='buy-btn'; btn.textContent = 'Buy';

                    btn.addEventListener('click', ()=>{
                        if(seed.locked){ showToast(seed.name + ' is locked'); return; }
                        if(window.game.balance < seed.price){ showToast('Not enough money for ' + seed.name); return; }
                        if(window.game.planted.length >= window.game.maxPlots){ showToast('No free farm plots. Buy a Farm Plot.'); return; }

                        window.game.balance -= seed.price;

                        // create planted object
                        const planted = {
                            id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
                            seedId: seed.id,
                            name: seed.name.replace(' Seed',''),
                            plantedAt: Date.now(),
                            growTime: seed.growTime * 1000, // ms
                            remaining: seed.growTime * 1000,
                            readyAt: null,
                            ready: false,
                            modly: false,
                            sellValue: (seed.sellValue != null)? seed.sellValue : (seed.yield? seed.yield * window.game.baseSellPrice : window.game.baseSellPrice),
                            canBeSold: seed.canBeSold !== false,
                            isShadow: !!seed.isShadow,
                            isMythic: !!seed.isMythic,
                            isDarkMajic: !!seed.isDarkMajic,
                            fadeStartTime: null,
                            upgradeTimer: null,
                            upgradeStartTime: null
                        };

                        window.game.planted.push(planted);
                            updateUI();
                    });

                    el.appendChild(img); el.appendChild(name); el.appendChild(price); el.appendChild(btn);
                    return el;
                }

                function makeUpgradeCard(up){
                    const el = document.createElement('div'); el.className='card';
                    const img = document.createElement('div'); img.className='card-img'; img.textContent = up.img;
                    const name = document.createElement('div'); name.className='card-name'; name.textContent = up.name;
                    const price = document.createElement('div'); price.className='card-price'; price.textContent = formatMoney(up.price);
                    const btn = document.createElement('button'); btn.className='buy-btn'; btn.textContent = 'Buy';

                    btn.addEventListener('click', ()=>{
                        if(window.game.balance < up.price){ showToast('Not enough money for ' + up.name); return; }
                        // Special-case: Farm Plot can be bought multiple times but has a 5s cooldown
                        if(up.id === 'u_plot'){
                            if(btn._cooling) { showToast('Farm Plot is cooling down'); return; }
                            window.game.balance -= up.price;
                            window.game.maxPlots += 1;
                            showToast('Farm Plot purchased. Plots: ' + window.game.maxPlots);
                            updateUI();

                            btn._cooling = true;
                            let remaining = 5;
                            btn.disabled = true;
                            btn.textContent = 'Cooling (' + remaining + 's)';
                            const iv = setInterval(()=>{
                                remaining -= 1;
                                if(remaining <= 0){
                                    clearInterval(iv);
                                    btn._cooling = false;
                                    btn.disabled = false;
                                    btn.textContent = 'Buy';
                                } else {
                                    btn.textContent = 'Cooling (' + remaining + 's)';
                                }
                            }, 1000);
                            return;
                        }

                        // Unlock upgrade: can be used while there are locked seeds
                        if(up.id === 'u_unlock'){
                            const lockedSeeds = seeds.filter(s=>s.locked);
                            if(lockedSeeds.length === 0){
                                showToast('No locked seeds left');
                                btn.disabled = true;
                                btn.textContent = 'No Seeds';
                                return;
                            }
                            // charge and unlock one random locked seed
                            window.game.balance -= up.price;
                            const pick = lockedSeeds[Math.floor(Math.random()*lockedSeeds.length)];
                            pick.locked = false;
                            showToast(pick.name + ' unlocked!');
                            renderSeeds();
                            updateUI();
                            // if no locked seeds remain, disable the unlock button
                            if(seeds.filter(s=>s.locked).length === 0){ btn.disabled = true; btn.textContent = 'Owned'; }
                            return;
                        }

                        // One-time purchases for other upgrades
                        window.game.balance -= up.price;
                        if(up.id === 'u_value'){
                            window.game.sellMultiplier += 0.10;
                        } else if(up.id === 'u_grow'){
                            window.game.growthSpeedMultiplier *= 1.10; // 10% faster
                        }

                        btn.disabled = true; btn.textContent = 'Owned';
                        updateUI();
                        renderSeeds();
                    });

                    el.appendChild(img); el.appendChild(name); el.appendChild(price); el.appendChild(btn);
                    return el;
                }

                function renderSeeds(){ sdGrid.innerHTML = ''; seeds.forEach(s=> sdGrid.appendChild(makeSeedCard(s))); }
                function renderUpgrades(){ upGrid.innerHTML = ''; upgrades.forEach(u=> upGrid.appendChild(makeUpgradeCard(u))); }

                function formatTime(ms){
                    if(ms <= 0) return '00:00';
                    const s = Math.ceil(ms / 1000);
                    const mins = Math.floor(s / 60);
                    const secs = s % 60;
                    return (mins>0? (mins+':') : '') + String(secs).padStart(2,'0');
                }

                function renderPlantList(){
                    if(!plantedListEl) return;
                    plantedListEl.innerHTML = '';
                    window.game.planted.forEach(p=>{
                        const item = document.createElement('div'); item.className='plant-item';
                        const left = document.createElement('div'); left.className='plant-name'; left.textContent = p.name;
                        const right = document.createElement('div');
                        if(!p.ready){
                            right.className='plant-timer';
                            right.textContent = formatTime(p.remaining);
                        } else {
                            right.className = 'plant-timer';
                            right.textContent = p.modly ? 'Modly' : 'Ready';
                        }
                        item.appendChild(left); item.appendChild(right);
                        plantedListEl.appendChild(item);
                    });
                }

                // Sell All: sells only sellable harvested potatoes
                sellBtn.addEventListener('click', ()=>{
                    if(window.game.harvested.length === 0) return showToast('Nothing to sell');
                    let earned = 0;
                    const remaining = [];
                    window.game.harvested.forEach(h=>{
                        if(h.canBeSold){ earned += h.sellValue * window.game.sellMultiplier; }
                        else { remaining.push(h); }
                    });
                    window.game.harvested = remaining;
                    window.game.balance += earned;
                    updateUI();
                    if(earned>0) showToast('Sold for ' + formatMoney(earned));
                });

                // Harvest All: harvest all planted that are ready
                harvestAllBtn.addEventListener('click', ()=>{
                    const ready = window.game.planted.filter(p=>p.ready);
                    if(ready.length === 0) return showToast('No ready potatoes to harvest');
                    ready.forEach(p=>{
                        window.game.harvested.push({type:p.seedId, sellValue: p.sellValue, canBeSold: p.canBeSold && !p.modly});
                        if(p.modly) showToast(p.name + ' harvested but is modly');
                    });
                    // remove ready items from planted
                    window.game.planted = window.game.planted.filter(p=>!p.ready);
                    updateUI(); renderPlantList();
                });

                // Harvesting via main potato button: harvest earliest ready potato if exists, otherwise give one free potato
                potatoBtn.addEventListener('click', ()=>{
                    // find earliest ready
                    const readyPlanted = window.game.planted.filter(p=>p.ready);
                    if(readyPlanted.length > 0){
                        readyPlanted.sort((a,b)=> (a.readyAt||0) - (b.readyAt||0));
                        const p = readyPlanted[0];
                        // remove from planted
                        window.game.planted = window.game.planted.filter(x=>x.id!==p.id);
                        // add to harvested stash
                        window.game.harvested.push({type:p.seedId, sellValue: p.sellValue, canBeSold: p.canBeSold && !p.modly});
                        if(p.modly) showToast(p.name + ' turned modly and is worth less.');
                    } else {
                        // manual click gives a common potato immediately
                        window.game.harvested.push({type:'manual', sellValue: window.game.baseSellPrice, canBeSold:true});
                    }
                    potatoBtn.style.transform = 'translateY(2px)'; setTimeout(()=> potatoBtn.style.transform='',80);
                    updateUI();
                });

                // game loop: update planted progress, detect ready and modly
                let lastTick = Date.now();
                function tick(){
                    const now = Date.now();
                    const dt = now - lastTick; lastTick = now;

                    // compute shadow buff: if any non-modly shadow planted exist, boost growth speed
                    const activeShadow = window.game.planted.some(p=> p.isShadow && !p.modly);
                    const shadowMultiplier = activeShadow ? 1.35 : 1.0;
                    const speed = window.game.growthSpeedMultiplier * shadowMultiplier;

                    // track for shadow fade removal
                    const toRemove = [];

                    window.game.planted.forEach((p, idx) => {
                        if(!p.ready){
                            p.remaining -= dt * speed;
                            if(p.remaining <= 0){ p.ready = true; p.readyAt = Date.now(); }
                        } else if(!p.modly){
                            const sinceReady = Date.now() - (p.readyAt || Date.now());
                            
                            // shadow fade mechanic: shadows disappear after 15 seconds of being ready
                            if(p.isShadow){
                                if(p.fadeStartTime === null) p.fadeStartTime = Date.now();
                                const fadeDuration = 15000; // 15 seconds to fade
                                const fadeProgress = (Date.now() - p.fadeStartTime) / fadeDuration;
                                if(fadeProgress >= 1.0){
                                    toRemove.push(idx);
                                    showToast(p.name + ' faded away');
                                    return;
                                }
                            }
                            
                            // modly mechanic for non-shadow potatoes
                            if(sinceReady >= 30000 && !p.isShadow && !p.isDarkMajic){
                                p.modly = true;
                                // reduce value to 10% (sells for 90% less)
                                p.sellValue = Math.max(0, p.sellValue * 0.10);
                                showToast(p.name + ' became modly and lost value');
                            }
                            
                            // golden to mythic conversion (1% chance per tick, ~once per 10 seconds)
                            if(p.seedId === 'golden' && Math.random() < 0.0001){
                                p.seedId = 'mythic';
                                p.name = 'Mythic';
                                p.isMythic = true;
                                p.sellValue = window.game.baseSellPrice * 10.99; // 999% more (10.99x original)
                                showToast('Golden converted to Mythic!');
                            }
                        }
                    });

                    // check for dark magic spawning from shadow+mythic pair (0.001% chance)
                    const readyShadows = window.game.planted.filter((p, idx) => p.isShadow && p.ready && !toRemove.includes(idx));
                    const readyMythics = window.game.planted.filter(p => p.isMythic && p.ready);
                    
                    if(readyShadows.length > 0 && readyMythics.length > 0){
                        for(let i = 0; i < readyShadows.length && readyMythics.length > 0; i++){
                            if(Math.random() < 0.000001){ // 0.001% chance per tick
                                const shadow = readyShadows[i];
                                const mythic = readyMythics[0];
                                
                                // remove both shadow and mythic potatoes
                                window.game.planted = window.game.planted.filter(p=> p.id !== shadow.id && p.id !== mythic.id);
                                
                                // create dark majic potato
                                const darkMajic = {
                                    id: 'p_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
                                    seedId: 'darkmajic',
                                    name: 'Dark Majic',
                                    plantedAt: Date.now(),
                                    growTime: 15000,
                                    remaining: 15000,
                                    readyAt: null,
                                    ready: false,
                                    modly: false,
                                    sellValue: window.game.baseSellPrice * 2.5, // 150% more than common
                                    canBeSold: true,
                                    isDarkMajic: true,
                                    upgradeTimer: null,
                                    upgradeStartTime: null
                                };
                                window.game.planted.push(darkMajic);
                                window.game.darkMajicCount++;
                                showToast('Dark Majic Potato created!');
                                
                                // refresh arrays for next iteration
                                readyMythics.splice(0, 1);
                                readyShadows.splice(i, 1);
                                i--;
                            }
                        }
                    }

                    // dark majic upgrade application: applies random upgrades at intervals
                    window.game.planted.forEach(p => {
                        if(p.isDarkMajic && p.ready && !p.modly){
                            if(p.upgradeTimer === null){
                                // initialize upgrade timer: 30-100 seconds base, doubled per dark majic potato
                                const baseDuration = 30000 + Math.random() * 70000; // 30-100 seconds
                                const multiplier = Math.pow(2, window.game.darkMajicCount - 1);
                                p.upgradeTimer = baseDuration * multiplier;
                                p.upgradeStartTime = Date.now();
                            } else {
                                const elapsed = Date.now() - p.upgradeStartTime;
                                if(elapsed >= p.upgradeTimer){
                                    // apply random upgrade (value or grow)
                                    const upgradeTypes = ['value', 'grow'];
                                    const randomUpgrade = upgradeTypes[Math.floor(Math.random() * upgradeTypes.length)];
                                    
                                    if(randomUpgrade === 'value'){
                                        window.game.sellMultiplier += 0.10;
                                        showToast('Dark Majic: Value +10%');
                                    } else if(randomUpgrade === 'grow'){
                                        window.game.growthSpeedMultiplier *= 1.10;
                                        showToast('Dark Majic: Speed +10%');
                                    }
                                    
                                    // reset timer for next upgrade
                                    const baseDuration = 30000 + Math.random() * 70000;
                                    const multiplier = Math.pow(2, window.game.darkMajicCount - 1);
                                    p.upgradeTimer = baseDuration * multiplier;
                                    p.upgradeStartTime = Date.now();
                                }
                            }
                        }
                    });

                    // remove faded shadows from planted array
                    if(toRemove.length > 0){
                        window.game.planted = window.game.planted.filter((p, idx) => !toRemove.includes(idx));
                    }

                    updateUI();
                }

                function updateUI(){
                    counter.textContent = window.game.harvested.length;
                    potatoesEl.textContent = 'Potatoes harvested: ' + window.game.harvested.length;
                    plantedEl.textContent = 'Planted: ' + window.game.planted.length + ' / ' + window.game.maxPlots;
                    balanceEl.textContent = 'Money: ' + formatMoney(window.game.balance);
                    pricesEl.textContent = 'Sell: ' + formatMoney(window.game.baseSellPrice * window.game.sellMultiplier);
                    renderPlantList();
                    // enable harvest all only if at least one ready
                    const readyCount = window.game.planted.filter(p=>p.ready).length;
                    if(harvestAllBtn) harvestAllBtn.disabled = readyCount === 0;
                }

                // initial render
                renderUpgrades(); renderSeeds(); updateUI();
                setInterval(tick, 1000);
                window.addEventListener('load', ()=>{ lastTick = Date.now(); tick(); });
            })();
            </script>
        
            </body>

        </html>
